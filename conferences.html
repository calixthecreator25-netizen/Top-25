<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conference Standings | College Football Merit Poll</title><style>body{background:#101923;color:#f2f6fc;font:16px system-ui;max-width:1000px;margin:35px auto;padding:0 16px}a{color:#9bd0ff}select{padding:10px;background:#23364b;color:white}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #394b60;text-align:left}.panel{border:1px solid #455a71;border-radius:12px;padding:16px;margin:18px 0}.scroll{overflow-x:auto}</style><p><a href="index.html">Home</a> · <a href="releases.html">Weekly releases</a></p><h1>Conference Standings</h1><p class="panel">EXPERIMENTAL — NOT OFFICIAL. Records use completed same-conference games. Tied records are displayed in merit-rank order, not official conference tiebreakers.</p><label>Division <select id="division"><option value="fbs">FBS</option><option value="fcs">FCS</option></select></label><p id="status">Loading…</p><main id="conferences"></main><script>
const division=document.getElementById('division'),status=document.getElementById('status'),main=document.getElementById('conferences');
async function render(){main.replaceChildren();try{const r=await fetch('data/conferences/'+division.value+'.json');if(!r.ok)throw Error('No published standings');const d=await r.json();status.textContent=d.division+' · '+d.as_of+' · '+d.conferences.length+' conferences';for(const conf of d.conferences){const section=document.createElement('section');section.className='panel';const h=document.createElement('h2');h.textContent=conf.name;section.append(h);const scroll=document.createElement('div');scroll.className='scroll';const table=document.createElement('table');const head=document.createElement('tr');for(const title of ['Team','Conference W-L','Overall W-L','National rank','Merit score']){const th=document.createElement('th');th.textContent=title;head.append(th)}table.append(head);for(const t of conf.teams){const tr=document.createElement('tr');for(const val of [t.name,t.conference_wins+'-'+t.conference_losses,t.overall_wins+'-'+t.overall_losses,'#'+t.rank,t.merit_score.toFixed(2)]){const td=document.createElement('td');td.textContent=val;tr.append(td)}table.append(tr)}scroll.append(table);section.append(scroll);main.append(section)}}catch(e){status.textContent='Unable to load: '+e.message}}
division.addEventListener('change',render);render();
</script></html>
