name: Validate ranking pipeline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Validate official ranking files if present
        run: |
          if [ -d data/official ]; then
            find data/official -name '*.json' -print0 | while IFS= read -r -d '' f; do python scripts/validate_rankings.py "$f"; done
          else
            echo "No official rankings yet; no rankings are being asserted."
          fi
